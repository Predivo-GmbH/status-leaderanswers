# Status page for leaderanswers.com - https://status.leaderanswers.com (11.11.2026)
# Standard: C:BusinessInternal Projectsstandardsstatus-page-standard.md (copied from Predivo-GmbH/status-predivo)
owner: Predivo-GmbH
repo: status-leaderanswers
user-agent: Predivo-GmbH

sites:
  # ONE website (status-page-standard rule 4): the German and English pages are the same site.
  - name: Website
    url: https://leaderanswers.com/
    slug: website
    icon: https://leaderanswers.com/favicon-32.png
    maxResponseTime: 10000
    # a 200 from a host error or parking page is not our site
    __dangerous__body_down_if_text_missing: "Leader Answers"
    # Kill switch (leaderanswers repo, D-063 / F-045, 11.11.2026): while the site shows its PLANNED placeholder (HTTP 503
    # with Retry-After and noindex, until the rework is finished), 503 is an expected answer, so the placeholder is not
    # reported as an outage. The body check above still needs our name, so a host's own 503 error page reads down.
    # Remove 503 again when the site is back for good (scripts/maintenance.mjs off --target production).
    expectedStatusCodes:
      - 200
      - 503
  # The page can load while nobody can sign in: ask the sign-in service of the PRODUCTION project
  # (Leader Answers production) with its PUBLIC key (what every visitor's browser receives), kept as a repo secret.
  # Plain GET only - never the sign-in-code endpoint (/auth/v1/otp), it is rate-limited.
  - name: Sign-in
    url: https://jvitcryltsdhdxfgaggz.supabase.co/auth/v1/health
    slug: signin
    headers:
      - "apikey: $LEADERANSWERS_SUPABASE_ANON"
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "GoTrue"

# the repo-scoped workflow token cannot edit repository metadata; description + homepage are set once through the API
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

status-website:
  # Public page = Upptime's own static site (GitHub Pages, gh-pages branch), custom domain below.
  # Statuspage.io page deferred (decision 11.11.2026).
  cname: status.leaderanswers.com
  baseUrl: /
  name: Leader Answers Status
  logoUrl: https://leaderanswers.com/favicon.svg
  favicon: https://leaderanswers.com/favicon-32.png
  faviconSvg: https://leaderanswers.com/favicon.svg
  theme: light
  introTitle: "**Status of leaderanswers.com**"
  introMessage: "Live status of leaderanswers.com and its sign-in. Checked about every five minutes from outside our own servers. Incidents and planned maintenance appear here automatically."
  navbar:
    - title: Status
      href: /
    - title: leaderanswers.com
      href: https://leaderanswers.com

